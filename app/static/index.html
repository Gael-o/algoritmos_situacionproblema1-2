HERRAMIENTAS.fallas = tablero => {
	const s = seccion(tablero, "¿Qué pasa si falla…?", "Tira enlaces o nodos con «Provocar falla» arriba del mapa y mide el daño. O deja que el programa busque los enlaces más críticos.");
	s.appendChild(crear("h3", {}, "Fallas activas"));
	if (!hayFallas()) {
		s.appendChild(crear("p", {class: "nota"}, "Ninguna por ahora. Elige «Provocar falla» y da clic en un enlace o nodo del mapa."));
	} else {
		const lista = crear("ul", {class: "lista"});
		[...estado.enlacesCaidos].forEach(i => {
			const enlace = estado.red.links[i];
			const li = crear("li", {}, "Enlace " + nombreCorto(enlace.u) + " – " + nombreCorto(enlace.v) + " ");
			const reparar = crear("button", {class: "btn mini sec"}, "reparar");
			reparar.onclick = () => alternarFallaEnlace(i);
			li.appendChild(reparar);
			lista.appendChild(li);
		});
		[...estado.nodosCaidos].forEach(i => {
			const li = crear("li", {}, "Nodo " + nombreLargo(i) + " ");
			const reparar = crear("button", {class: "btn mini sec"}, "reparar");
			reparar.onclick = () => alternarFallaNodo(i);
			li.appendChild(reparar);
			lista.appendChild(li);
		});
		s.appendChild(lista);
		const limpiar = crear("button", {class: "btn peligro mini"}, "Quitar todas las fallas");
		limpiar.onclick = limpiarFallas;
		s.appendChild(limpiar);
	}

	const medicion = seccion(tablero, "Impacto en la red");
	const fila = crear("div", {class: "fila"});
	const izquierda = crear("div");
	const derecha = crear("div");
	campo(izquierda, "Origen", selectorNodo("origen"));
	campo(derecha, "Destino", selectorNodo("destino"));
	fila.append(izquierda, derecha);
	medicion.appendChild(fila);
	const botones = crear("div", {class: "botones"});
	const medir = crear("button", {class: "btn"}, "Medir impacto");
	const buscar = crear("button", {class: "btn sec"}, "Buscar enlaces críticos");
	botones.append(medir, buscar);
	medicion.appendChild(botones);
	const resultado = crear("div");
	medicion.appendChild(resultado);

	async function indicadores(conFallas) {
		const nodos = conFallas ? indicesNodosActivos() : estado.red.nodes.map((n, i) => i);
		const enlaces = conFallas ? indicesEnlacesActivos() : estado.red.links.map((l, i) => i);
		const mst = (await ejecutar("mst", {nodes: nodos, edges: enlaces.map(i => [estado.red.links[i].u, estado.red.links[i].v, estado.red.links[i].cost])})).salida;
		const flujoEntrada = conFallas ? entradaFlujo(estado.origen, estado.destino) : {n: estado.red.nodes.length, edges: estado.red.links.map(l => [l.u, l.v, l.capacity]), directed: false, source: estado.origen, sink: estado.destino};
		const flujo = (await ejecutar("maxflow", flujoEntrada)).salida;
		const propagacion = (await ejecutar("propagation", entradaPropagacion({origen: estado.origen, destino: null, metrica: "time", tecnica: "dijkstra", procesamiento: estado.red.hopDelay || 1}, conFallas))).salida;
		return {mst, flujo, propagacion, totalNodos: nodos.length};
	}

	async function medirImpacto() {
		estado.capa = {mostrarExtremos: true, usaDestino: true};
		pedirDibujo();
		if (estado.nodosCaidos.has(estado.origen)) {
			resultado.textContent = "";
			resultado.appendChild(crear("p", {class: "bad"}, "El origen está caído; elige otro origen para medir."));
			return;
		}
		resultado.textContent = "Midiendo con el programa en C++…";
		const antes = await indicadores(false);
		const despues = await indicadores(true);
		const conectada = x => !x.propagacion.error && x.propagacion.unreachable.length === 0;
		const filas = [
			["Red conectada", conectada(antes) ? "sí" : "no", conectada(despues) ? "sí" : "no"],
			["Nodos aislados", String(antes.propagacion.unreachable ? antes.propagacion.unreachable.length : "—"), String(despues.propagacion.unreachable ? despues.propagacion.unreachable.length : "—")],
			["Costo del árbol mínimo (km)", formatoMiles(antes.mst.totalCost), despues.mst.connected ? formatoMiles(despues.mst.totalCost) : "no hay árbol"],
			["Flujo máximo (Mbit/s)", formatoMiles(antes.flujo.maxFlow), formatoMiles(despues.flujo.maxFlow)],
			["Un aviso llega a todos en", formatoMs(antes.propagacion.maxTime), despues.propagacion.error ? "—" : formatoMs(despues.propagacion.maxTime)]
		];
		resultado.textContent = "";
		resultado.appendChild(tabla(["Indicador", "Sin fallas", "Con fallas"], filas, {numericas: [1, 2]}));
		resultado.appendChild(crear("p", {class: "nota"}, "Flujo de " + nombreLargo(estado.origen) + " a " + nombreLargo(estado.destino) + "; el aviso sale de " + nombreLargo(estado.origen) + ". Si no hay fallas, las dos columnas son iguales."));
	}

	let cancelado = false;
	async function buscarCriticos() {
		const candidatos = indicesEnlacesActivos();
		if (candidatos.length > 150 && !confirm("Son " + candidatos.length + " enlaces: se harán " + 2 * candidatos.length + " llamadas al programa y puede tardar. ¿Continuar?")) {
			return;
		}
		cancelado = false;
		resultado.textContent = "";
		const progresoTexto = crear("p", {class: "nota"});
		const cancelar = crear("button", {class: "btn mini peligro"}, "Cancelar");
		cancelar.onclick = () => { cancelado = true; };
		resultado.append(progresoTexto, cancelar);
		const base = (await ejecutar("maxflow", entradaFlujo(estado.origen, estado.destino))).salida.maxFlow;
		const filas = [];
		for (let k = 0; k < candidatos.length && !cancelado; k++) {
			const i = candidatos[k];
			progresoTexto.textContent = "Probando enlace " + (k + 1) + " de " + candidatos.length + "…";
			const extra = new Set([i]);
			const flujo = (await ejecutar("maxflow", entradaFlujo(estado.origen, estado.destino, extra))).salida.maxFlow;
			const propagacion = (await ejecutar("propagation", entradaPropagacion({origen: estado.origen, destino: null, metrica: "time", tecnica: "dijkstra", procesamiento: 1}, true, extra))).salida;
			filas.push({i, perdida: base - flujo, aislados: propagacion.unreachable ? propagacion.unreachable.length : 0});
		}
		resultado.textContent = "";
		const daninos = filas.filter(f => f.perdida > 0 || f.aislados > 0);
		daninos.sort((a, b) => b.aislados - a.aislados || b.perdida - a.perdida);
		const peorPerdida = Math.max(1, ...daninos.map(f => f.perdida));
		const criticos = new Map();
		daninos.forEach(f => criticos.set(f.i, f.aislados > 0 ? 1 : f.perdida / peorPerdida));
		estado.capa = {mostrarExtremos: true, usaDestino: true, criticos};
		resultado.appendChild(crear("p", {}, "Flujo base de " + nombreLargo(estado.origen) + " a " + nombreLargo(estado.destino) + ": " + formatoMiles(base) + " Mbit/s." + (cancelado ? " (Búsqueda cancelada: resultados parciales.)" : "")));
		if (!daninos.length) {
			resultado.appendChild(crear("p", {class: "ok"}, "Ningún enlace, por sí solo, reduce ese flujo ni deja nodos aislados: para este par la red tiene redundancia suficiente."));
		} else {
			resultado.appendChild(crear("p", {}, daninos.length + " de " + filas.length + " enlaces hacen daño si caen solos; los demás no cambian nada para este par:"));
			const mostrados = daninos.slice(0, 12);
			const t = tabla(["Enlace", "Flujo perdido", "Nodos aislados"], mostrados.map(f => {
				const enlace = estado.red.links[f.i];
				return [nombreCorto(enlace.u) + " – " + nombreCorto(enlace.v), formatoMiles(f.perdida) + " Mbit/s", String(f.aislados)];
			}), {numericas: [1, 2]});
			[...t.querySelectorAll("tr")].slice(1).forEach((tr, k) => {
				tr.classList.add("clic");
				tr.title = "Clic para tirar este enlace";
				tr.onclick = () => alternarFallaEnlace(mostrados[k].i);
			});
			resultado.appendChild(t);
			resultado.appendChild(crear("p", {class: "nota"}, "En el mapa, los enlaces críticos están en naranja (más grueso = más daño). Clic en una fila para tirar ese enlace y medir de nuevo."));
		}
		pedirDibujo();
	}
	medir.onclick = medirImpacto;
	buscar.onclick = buscarCriticos;
	estado.capa = {mostrarExtremos: true, usaDestino: true};
	estado.recalcular = null;
	ponerEstadoMapa("Origen y destino marcados con anillo. Las fallas se ven en rojo.");
	if (hayFallas()) {
		medirImpacto();
	}
};

/* ---------- 7.8 Consola de ciberseguridad ---------- */
function resaltar(texto, rangos) {
	const piezas = [];
	let posicion = 0;
	rangos.slice().sort((a, b) => a[0] - b[0]).forEach(([inicio, fin]) => {
		if (inicio > 0) {
			if (inicio - 1 > posicion) {
				piezas.push(document.createTextNode(texto.slice(posicion, inicio - 1)));
			}
			piezas.push(crear("mark", {}, texto.slice(inicio - 1, fin)));
			posicion = fin;
		}
	});
	piezas.push(document.createTextNode(texto.slice(posicion)));
	return piezas;
}

		resultado.textContent = "Analizando…";

		} else {
			const matriz = coincidencias.matches || [];
			const celda = valor => valor === undefined ? "?" : (valor > 0 ? "sí, posición " + valor : "no aparece");
			const t = tabla(["Firma", "Transmisión 1", "Transmisión 2"], lista.map((firma, k) => [firma, celda((matriz[0] || [])[k]), celda((matriz[1] || [])[k])]));
			[...t.querySelectorAll("tr")].slice(1).forEach((tr, k) => {
				tr.children[1].className = (matriz[0] || [])[k] > 0 ? "ok" : "bad";
				tr.children[2].className = (matriz[1] || [])[k] > 0 ? "ok" : "bad";
			});
			resultado.appendChild(t);
			resultado.appendChild(crear("p", {class: "nota"}, "Respuesta del programa (formato del autograder): " + JSON.stringify(matriz) + " — una fila por transmisión, una columna por firma, −1 si no aparece."));
		}
		resultado.appendChild(crear("h3", {}, "Palíndromo más largo (Manacher)"));
		transmisiones.forEach((texto, k) => {
			const rango = (palindromos.ranges || [])[k];
			const caja = crear("div", {class: "seq"});
			resaltar(texto.replace(/\s/g, "").toUpperCase(), rango ? [rango] : []).forEach(n => caja.appendChild(n));
			resultado.appendChild(caja);
			resultado.appendChild(crear("p", {class: "nota"}, "Transmisión " + (k + 1) + ": posiciones " + (rango ? rango.join(" a ") : "?")));
		});
		resultado.appendChild(crear("h3", {}, "Subcadena común más larga (hashing)"));
		const rango = comun.range;
		resultado.appendChild(crear("p", {}, rango ? "Posiciones " + rango.join(" a ") + " de la transmisión 1 (" + comun.length + " caracteres)" : JSON.stringify(comun)));
		transmisiones.forEach((texto, k) => {
			const caja = crear("div", {class: "seq"});
			const r = comun.ranges ? comun.ranges[k] : (k === 0 ? rango : null);
			resaltar(texto.replace(/\s/g, "").toUpperCase(), r ? [r] : []).forEach(n => caja.appendChild(n));
			resultado.appendChild(caja);
		});
	};
	ponerEstadoMapa("La consola trabaja sobre el tráfico de la red, no sobre el mapa. Las transmisiones salen de las demandas de GÉANT.");
	analizar.onclick();
};

/* ---------- 7.9 Casos de prueba ---------- */
HERRAMIENTAS.escenarios = tablero => {
	const s = seccion(tablero, "Casos de prueba", "Cada caso es un archivo en app/data/scenarios. Al cargar uno, toda la aplicación pasa a trabajar con esos datos y se quitan las fallas.");
	estado.escenarios.forEach(e => {
		const caja = crear("div", {class: "tarjeta", style: "margin-top:10px"});
		caja.appendChild(crear("strong", {}, e.nombre + (e.id === estado.red.scenario.id ? " (activo)" : "")));
		caja.appendChild(crear("p", {class: "nota"}, e.descripcion));
		caja.appendChild(crear("p", {class: "nota"}, "Fuente: " + e.fuente));
		const cargar = crear("button", {class: "btn mini"}, "Cargar este caso");
		cargar.onclick = () => cargarEscenario(e.id);
		caja.appendChild(cargar);
		s.appendChild(caja);
	});
	estado.capa = {};
};

/* =====================================================================
   8. Carga de la red y arranque
   ===================================================================== */

async function cargarEscenario(id) {
	detenerAnimacion();
	const consulta = id ? "?scenario=" + encodeURIComponent(id) : "";
	estado.red = await (await fetch("/api/network" + consulta)).json();
	estado.enlacesCaidos.clear();
	estado.nodosCaidos.clear();
	estado.origen = estado.red.source;
	estado.destino = estado.red.sink;
	document.getElementById("chipEscenario").textContent = estado.red.scenario.nombre;
	actualizarChipFallas();
	calcularProyeccion();
	verEuropa();
	if (id) {
		avisar("Caso cargado: " + estado.red.scenario.nombre);
	}
	mostrarHerramienta(estado.herramienta);
}

(async () => {
	prepararMapa();
	document.addEventListener("click", cerrarMenus);
	document.addEventListener("keydown", evento => {
		if (evento.key === "Escape") {
			cerrarMenus();
		}
	});
	document.getElementById("hamburguesa").onclick = () => {
		const barra = document.getElementById("barra");
		barra.classList.toggle("menuAbierto");
		document.getElementById("hamburguesa").setAttribute("aria-expanded", String(barra.classList.contains("menuAbierto")));
	};
	document.getElementById("chipFallas").onclick = () => mostrarHerramienta("fallas");
	estado.escenarios = await (await fetch("/api/scenarios")).json();
	await cargarEscenario("");
})();
</script>
