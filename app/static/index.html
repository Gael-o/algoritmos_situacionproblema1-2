<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENTINEL Digital Twin</title>
<!--
  SENTINEL Digital Twin: interfaz de Sentinela del Norte sobre la red GEANT (SNDlib).
  Esta pagina NO calcula ningun algoritmo: arma el JSON de entrada, se lo manda al servidor
  (que ejecuta ./sentinel, el mismo programa que evalua el autograder) y dibuja la respuesta.
  Autores: Gael Alexander Zaragoza Torres (A01385956), Damian Alejandro Gomez Mena (A01385923),
  David Rangel Monsivais (A01385671). Fecha: 22/10/2026.
-->
<style>
:root{
 --bg:#f3f5f7;--panel:#ffffff;--ink:#15202b;--mute:#5a6772;--line:#d6dce2;--soft:#eef1f4;
 --mar:#e6edf3;--tierra:#ffffff;
 --acc:#0b6bcb;--acc2:#c76a00;--ok:#1a7f45;--bad:#c0392b;
 --enlace:#9aa7b4;--nodo:#3d4b58;--inactivo:#b3bec8;
 --mst:#1a7f45;--ruta:#c76a00;--celda:#0b6bcb;
 --flujoBajo:#9cc6ec;--flujoAlto:#0b4f9c;--saturado:#e8590c;--corte:#7a1fa2;
 --paquete:#e8590c;--alcanzado:#0b6bcb;--critico:#e8590c;
 --sobreAcento:#ffffff;
 --sombra:0 6px 24px rgba(16,24,32,.12);
}
@media (prefers-color-scheme:dark){:root{
 --bg:#0f141a;--panel:#171f28;--ink:#e6ebf0;--mute:#9aa7b4;--line:#2b3744;--soft:#1e2833;
 --mar:#121a22;--tierra:#1a232d;
 --acc:#5aa9ff;--acc2:#ffad42;--ok:#4cc27f;--bad:#ff6b5e;
 --enlace:#4e5d6c;--nodo:#c9d3dc;--inactivo:#55636f;
 --mst:#4cc27f;--ruta:#ffad42;--celda:#5aa9ff;
 --flujoBajo:#1f4f7a;--flujoAlto:#7cc0ff;--saturado:#ff8a3d;--corte:#d28cff;
 --paquete:#ff8a3d;--alcanzado:#5aa9ff;--critico:#ff8a3d;
 --sobreAcento:#0f141a;
 --sombra:0 6px 24px rgba(0,0,0,.45);
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- Barra superior con menus desplegables ---------- */
.barra{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:0 14px;height:56px;background:var(--panel);border-bottom:1px solid var(--line)}
.marca{display:flex;align-items:center;gap:9px;white-space:nowrap}
.marca strong{display:block;font-size:15px;letter-spacing:.04em}
.marca span{display:block;font-size:12px;color:var(--mute);margin-top:-3px}
.menu{display:flex;align-items:center;gap:2px;flex:1}
.grupo{position:relative}
.grupoBoton{background:none;border:0;padding:8px 11px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px}
.grupoBoton:hover,.grupoBoton[aria-expanded="true"]{background:var(--soft)}
.grupoBoton.activo{color:var(--acc);font-weight:600}
.grupoBoton svg{width:10px;height:10px;transition:transform .15s}
.grupoBoton[aria-expanded="true"] svg{transform:rotate(180deg)}
.desplegable{position:absolute;top:calc(100% + 6px);left:0;min-width:270px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sombra);padding:6px;display:none}
.grupo.abierto .desplegable{display:block}
.opcion{display:block;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:8px 10px;cursor:pointer}
.opcion:hover,.opcion:focus-visible{background:var(--soft)}
.opcion.activa{background:var(--soft);box-shadow:inset 3px 0 0 var(--acc)}
.opcion small{display:block;color:var(--mute);font-size:12px;line-height:1.35}
.separador{height:1px;background:var(--line);margin:5px 4px}
.estadoBarra{display:flex;gap:8px;align-items:center;margin-left:auto}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 11px;font-size:13px;color:var(--mute);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
button.chip{cursor:pointer}
.chip.alerta{border-color:var(--bad);color:var(--bad);font-weight:600}
.hamburguesa{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}

/* ---------- Area de trabajo: mapa + tablero ---------- */
.area{display:grid;grid-template-columns:minmax(0,1fr) 420px;height:calc(100vh - 56px)}
.area.ancho{grid-template-columns:minmax(0,1fr) 560px}
.panelMapa{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}
.herramientasMapa{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.segmentado{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;align-items:stretch}
.segmentado span{padding:5px 9px;font-size:13px;color:var(--mute);border-right:1px solid var(--line);display:flex;align-items:center}
.segmentado button{background:var(--panel);border:0;border-right:1px solid var(--line);padding:5px 11px;cursor:pointer;font-size:13px}
.segmentado button:last-child{border-right:0}
.segmentado button[aria-pressed="true"]{background:var(--acc);color:var(--sobreAcento)}
.segmentado button.peligro[aria-pressed="true"]{background:var(--bad);color:var(--sobreAcento)}
.zoom{display:inline-flex;gap:4px}
.zoom button{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:34px;height:32px;padding:0 9px;cursor:pointer;font-size:13px}
.zoom button:hover{background:var(--soft)}
.lienzo{position:relative;flex:1;min-height:0;background:var(--mar);overflow:hidden}
#mapa{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#mapa:focus{outline:none}
#mapa:focus-visible{outline:2px solid var(--acc);outline-offset:-3px}
#mapa.arrastrando{cursor:grabbing}
#mapa [data-tipo]{cursor:pointer}
.leyenda{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px;max-width:min(330px,calc(100% - 20px));pointer-events:none}
.leyenda:empty{display:none}
.leyenda div{display:flex;align-items:center;gap:7px;margin:2px 0}
.leyenda i{display:inline-block;width:20px;height:0;border-top:3px solid;flex:none}
.leyenda b.punto{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none}
.leyenda .barraGradiente{width:110px;height:8px;border-radius:4px;flex:none}
.ayudaMapa{position:absolute;right:10px;bottom:10px;font-size:12px;color:var(--mute);background:color-mix(in srgb,var(--panel) 85%,transparent);border-radius:7px;padding:3px 8px;pointer-events:none}
#tooltip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--sombra);padding:7px 10px;font-size:13px;max-width:280px;display:none;z-index:5}
#tooltip strong{display:block}
#tooltip span{color:var(--mute);display:block}
.estadoMapa{margin:0;padding:6px 12px;font-size:13px;color:var(--mute);background:var(--panel);border-top:1px solid var(--line);min-height:32px}

.tablero{overflow:auto;min-height:0;background:var(--panel)}
.tablero section{padding:16px 18px;border-bottom:1px solid var(--line)}
.tablero h2{margin:0 0 2px;font-size:18px}
.tablero h3{margin:14px 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.tablero p{margin:6px 0}
.nota{color:var(--mute);font-size:13px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
select,textarea,input[type=text]{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:13px;min-height:64px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--acc)}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fila>*{flex:1}
.botones{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{background:var(--acc);color:var(--sobreAcento);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.peligro{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.mini{padding:3px 9px;font-size:13px}
.grande{font-size:30px;font-weight:700;line-height:1.1;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.tarjetas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.tarjeta{background:var(--soft);border-radius:9px;padding:9px 11px}
.tarjeta b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.tarjeta span{font-size:12px;color:var(--mute)}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:6px}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.clic{cursor:pointer}
tr.clic:hover{background:var(--soft)}
tr.actual{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--mute)}
.reloj{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.reloj .grande{margin:0}
.progreso{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:6px}
.progreso div{height:100%;width:0;background:var(--paquete)}
.eventos{position:relative;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px}
.eventos table{margin:0}
.eventos th{position:sticky;top:0;background:var(--panel)}
.seq{font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all;background:var(--soft);border-radius:6px;padding:6px 8px;margin:4px 0}
mark{background:color-mix(in srgb,var(--acc2) 35%,transparent);color:inherit;padding:0 1px;border-radius:2px}
.lista{margin:6px 0;padding-left:18px}
.lista li{margin:3px 0}
.aviso{border-left:3px solid var(--acc2);background:var(--soft);padding:8px 10px;border-radius:0 8px 8px 0;font-size:13px;margin-top:10px}
.toast{position:fixed;right:16px;bottom:16px;z-index:50;background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:9px;box-shadow:var(--sombra);font-size:14px;max-width:360px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.ver{opacity:1;transform:none}
.oculto{display:none!important}

/* ---------- Pantallas chicas: el menu se vuelve vertical ---------- */
@media (max-width:900px){
 .barra{flex-wrap:wrap;height:auto;min-height:56px;padding:8px 12px}
 .hamburguesa{display:block}
 .menu{display:none;order:3;flex-basis:100%;flex-direction:column;align-items:stretch;gap:0;padding-bottom:6px}
 .barra.menuAbierto .menu{display:flex}
 .grupoBoton{width:100%;justify-content:space-between;padding:10px 8px}
 .desplegable{position:static;box-shadow:none;border:0;padding:0 0 4px 10px;min-width:0}
 .estadoBarra{order:2;margin-left:0;flex-basis:100%}
 .area,.area.ancho{display:block;height:auto}
 .panelMapa{height:62vh;border-right:0;border-bottom:1px solid var(--line)}
}
</style>
</head>
<body>

<header class="barra" id="barra">
 <div class="marca">
  <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="6" cy="7" r="3" fill="var(--acc)"/><circle cx="20" cy="6" r="3" fill="var(--acc)"/><circle cx="13" cy="20" r="3.4" fill="var(--acc2)"/><path d="M6 7 20 6 13 20Z" fill="none" stroke="var(--acc)" stroke-width="1.6"/></svg>
  <div><strong>SENTINEL</strong><span>Digital Twin · GÉANT</span></div>
 </div>
 <button class="hamburguesa" id="hamburguesa" aria-expanded="false" aria-controls="menuPrincipal">Menú</button>
 <nav class="menu" id="menuPrincipal" aria-label="Herramientas"></nav>
 <div class="estadoBarra">
  <span class="chip" id="chipEscenario" title="Caso de prueba activo">Cargando…</span>
  <button class="chip" id="chipFallas" title="Ver y quitar las fallas activas">Sin fallas</button>
 </div>
</header>

<main class="area" id="area">
 <section class="panelMapa" aria-label="Mapa de la red">
  <div class="herramientasMapa">
   <div class="segmentado" role="group" aria-label="Qué hace un clic en el mapa" id="modoClic">
    <span>Clic en el mapa:</span>
    <button data-modo="origen" aria-pressed="true" title="Un clic en un nodo lo vuelve el origen">Origen</button>
    <button data-modo="destino" aria-pressed="false" title="Un clic en un nodo lo vuelve el destino">Destino</button>
    <button data-modo="fallar" class="peligro" aria-pressed="false" title="Un clic en un enlace o nodo lo tira (otro clic lo repara)">Provocar falla</button>
   </div>
   <div class="zoom" role="group" aria-label="Zoom">
    <button id="zoomMenos" title="Alejar (tecla -)" aria-label="Alejar">−</button>
    <button id="zoomMas" title="Acercar (tecla +)" aria-label="Acercar">+</button>
    <button id="verEuropa" title="Ajustar a Europa">Europa</button>
    <button id="verTodo" title="Ver toda la red, incluido Nueva York">Toda la red</button>
   </div>
  </div>
  <div class="lienzo" id="lienzo">
   <svg id="mapa" tabindex="0" role="img" aria-label="Mapa interactivo de la red GÉANT" preserveAspectRatio="xMidYMid meet">
    <g id="capaEstatica"></g><g id="capaDinamica"></g>
   </svg>
   <div id="tooltip" role="status"></div>
   <div class="leyenda" id="leyenda"></div>
   <div class="ayudaMapa">Rueda o pellizco: zoom · arrastrar: mover</div>
  </div>
  <p class="estadoMapa" id="estadoMapa"></p>
 </section>
 <aside class="tablero" id="tablero" aria-live="polite"></aside>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";

/* =====================================================================
   1. Estado global y utilidades
   ===================================================================== */

// Todo lo que la pagina recuerda vive aqui. Las fallas, el origen y el destino son globales:
// cualquier herramienta los toma en cuenta, asi se puede preguntar "que pasa si falla esto".
const estado = {
	red: null,
	escenarios: [],
	herramienta: "explorar",
	origen: 0,
	destino: 1,
	enlacesCaidos: new Set(),
	nodosCaidos: new Set(),
	modoClic: "origen",
	capa: {},
	vista: null,
	vistaReferencia: null,
	proyeccion: [],
	parametrosProyeccion: null,
	recalcular: null,
	animacion: null
};

const PAISES = {at: "Austria", be: "Bélgica", ch: "Suiza", cz: "Chequia", de: "Alemania", es: "España",
	fr: "Francia", gr: "Grecia", hr: "Croacia", hu: "Hungría", ie: "Irlanda", il: "Israel", it: "Italia",
	lu: "Luxemburgo", nl: "Países Bajos", ny: "Nueva York", pl: "Polonia", pt: "Portugal", se: "Suecia",
	si: "Eslovenia", sk: "Eslovaquia", uk: "Reino Unido"};

const ETIQUETAS_SVG = ["svg", "g", "line", "circle", "polygon", "polyline", "text", "path", "rect", "title"];

// Crea un elemento HTML o SVG con sus atributos y, opcionalmente, su texto.
function crear(etiqueta, atributos, texto) {
	const esSvg = ETIQUETAS_SVG.includes(etiqueta);
	const elemento = esSvg ? document.createElementNS("http://www.w3.org/2000/svg", etiqueta) : document.createElement(etiqueta);
	for (const clave in (atributos || {})) {
		if (atributos[clave] !== undefined && atributos[clave] !== null) {
			elemento.setAttribute(clave, atributos[clave]);
		}
	}
	if (texto !== undefined) {
		elemento.textContent = texto;
	}
	return elemento;
}

// Unico punto donde la pagina habla con el programa en C++.
async function ejecutar(modo, entrada) {
	const inicio = performance.now();
	try {
		const respuesta = await fetch("/api/run", {method: "POST", body: JSON.stringify({mode: modo, input: entrada})});
		const salida = await respuesta.json();
		return {salida, ms: performance.now() - inicio};
	} catch (error) {
		return {salida: {error: "No se pudo hablar con el servidor: " + error.message}, ms: 0};
	}
}

function nombreCorto(i) {
	return estado.red.nodes[i].name.split(".")[0];
}

function nombreLargo(i) {
	const partes = estado.red.nodes[i].name.split(".");
	const pais = PAISES[partes[1]];
	return pais ? pais + " (" + partes[0] + ")" : estado.red.nodes[i].name;
}

function formatoMs(valor) {
	return valor.toFixed(valor < 10 ? 2 : 1) + " ms";
}

function formatoMiles(valor) {
	return Math.round(valor).toLocaleString("es-MX");
}

function avisar(texto) {
	const toast = document.getElementById("toast");
	toast.textContent = texto;
	toast.classList.add("ver");
	clearTimeout(avisar.temporizador);
	avisar.temporizador = setTimeout(() => toast.classList.remove("ver"), 3200);
}

function leerColor(variable) {
	return getComputedStyle(document.documentElement).getPropertyValue(variable).trim();
}

// Mezcla dos colores hexadecimales; t va de 0 (primero) a 1 (segundo).
function mezclarColor(colorUno, colorDos, t) {
	const uno = parseInt(colorUno.slice(1), 16);
	const dos = parseInt(colorDos.slice(1), 16);
	const canal = desplazamiento => Math.round(((uno >> desplazamiento) & 255) * (1 - t) + ((dos >> desplazamiento) & 255) * t);
	return "rgb(" + canal(16) + "," + canal(8) + "," + canal(0) + ")";
}

/* =====================================================================
   2. Fallas y armado de entradas para el C++
   ===================================================================== */

function enlaceActivo(i) {
	const enlace = estado.red.links[i];
	return !estado.enlacesCaidos.has(i) && !estado.nodosCaidos.has(enlace.u) && !estado.nodosCaidos.has(enlace.v);
}

function indicesNodosActivos() {
	return estado.red.nodes.map((n, i) => i).filter(i => !estado.nodosCaidos.has(i));
}

function indicesEnlacesActivos() {
	return estado.red.links.map((l, i) => i).filter(enlaceActivo);
}

function hayFallas() {
	return estado.enlacesCaidos.size + estado.nodosCaidos.size > 0;
}

// Traduce una arista de la respuesta del C++ ([u, v, ...]) al indice del enlace en el mapa.
function buscadorDeEnlaces(indices) {
	const porPar = new Map();
	indices.forEach(i => {
		const enlace = estado.red.links[i];
		const clave = Math.min(enlace.u, enlace.v) + "-" + Math.max(enlace.u, enlace.v);
		if (!porPar.has(clave)) {
			porPar.set(clave, []);
		}
		porPar.get(clave).push(i);
	});
	return (u, v) => {
		const lista = porPar.get(Math.min(u, v) + "-" + Math.max(u, v)) || [];
		return lista.length ? lista.shift() : -1;
	};
}

function entradaFlujo(origen, destino, enlacesExtraCaidos) {
	const extra = enlacesExtraCaidos || new Set();
	return {
		n: estado.red.nodes.length,
		edges: estado.red.links.map((l, i) => [l.u, l.v, (enlaceActivo(i) && !extra.has(i)) ? l.capacity : 0]),
		directed: false,
		source: origen,
		sink: destino
	};
}

function entradaPropagacion(opciones, conFallas, enlacesExtraCaidos) {
	const caidos = conFallas ? [...estado.enlacesCaidos] : [];
	(enlacesExtraCaidos ? [...enlacesExtraCaidos] : []).forEach(i => caidos.push(i));
	const entrada = {
		n: estado.red.nodes.length,
		edges: estado.red.links.map(l => [l.u, l.v, l.cost]),
		delays: estado.red.links.map(l => l.delay),
		hopDelay: opciones.procesamiento,
		metric: opciones.metrica,
		algorithm: opciones.tecnica,
		source: opciones.origen,
		failedLinks: caidos,
		failedNodes: conFallas ? [...estado.nodosCaidos] : []
	};
	if (opciones.destino !== null && opciones.destino !== undefined) {
		entrada.target = opciones.destino;
	}
	return entrada;
}

function alternarFallaEnlace(i) {
	const enlace = estado.red.links[i];
	const texto = nombreCorto(enlace.u) + " – " + nombreCorto(enlace.v);
	if (estado.enlacesCaidos.has(i)) {
		estado.enlacesCaidos.delete(i);
		avisar("Enlace reparado: " + texto);
	} else {
		estado.enlacesCaidos.add(i);
		avisar("Enlace caído: " + texto);
	}
	alCambiarFallas();
}

function alternarFallaNodo(i) {
	if (estado.nodosCaidos.has(i)) {
		estado.nodosCaidos.delete(i);
		avisar("Nodo reparado: " + nombreLargo(i));
	} else {
		estado.nodosCaidos.add(i);
		avisar("Nodo caído: " + nombreLargo(i));
	}
	alCambiarFallas();
}

function limpiarFallas() {
	estado.enlacesCaidos.clear();
	estado.nodosCaidos.clear();
	alCambiarFallas();
}

function alCambiarFallas() {
	actualizarChipFallas();
	if (estado.recalcular) {
		estado.recalcular();
	}
	if (estado.herramienta === "fallas") {
		mostrarHerramienta("fallas");
	}
	pedirDibujo();
}

function actualizarChipFallas() {
	const chip = document.getElementById("chipFallas");
	const total = estado.enlacesCaidos.size + estado.nodosCaidos.size;
	chip.textContent = total ? ("Fallas activas: " + total) : "Sin fallas";
	chip.classList.toggle("alerta", total > 0);
}

/* =====================================================================
   3. Proyeccion, vista y zoom del mapa
   ===================================================================== */

// Proyeccion equirectangular corregida por la latitud media: suficiente para Europa.
function calcularProyeccion() {
	const nodos = estado.red.nodes;
	const latitudMedia = nodos.reduce((suma, n) => suma + n.lat, 0) / nodos.length;
	const coseno = Math.cos(latitudMedia * Math.PI / 180);
	const xs = nodos.map(n => n.lon * coseno);
	const ys = nodos.map(n => -n.lat);
	const minX = Math.min(...xs);
	const minY = Math.min(...ys);
	const ancho = Math.max(...xs) - minX || 1;
	const escala = 1000 / ancho;
	estado.parametrosProyeccion = {coseno, minX, minY, escala};
	estado.proyeccion = nodos.map(n => proyectar(n.lon, n.lat));
}

function proyectar(lon, lat) {
	const p = estado.parametrosProyeccion;
	return [(lon * p.coseno - p.minX) * p.escala, (-lat - p.minY) * p.escala];
}

function cajaDe(indices) {
	const puntos = indices.map(i => estado.proyeccion[i]);
	const minX = Math.min(...puntos.map(p => p[0]));
	const maxX = Math.max(...puntos.map(p => p[0]));
	const minY = Math.min(...puntos.map(p => p[1]));
	const maxY = Math.max(...puntos.map(p => p[1]));
	return {minX, maxX, minY, maxY};
}

// Ajusta la vista a un conjunto de nodos, respetando la proporcion del recuadro del mapa.
function ajustarVista(indices) {
	const svg = document.getElementById("mapa");
	const proporcion = (svg.clientWidth || 800) / (svg.clientHeight || 500);
	const caja = cajaDe(indices.length ? indices : estado.red.nodes.map((n, i) => i));
	let ancho = Math.max(caja.maxX - caja.minX, 40);
	let alto = Math.max(caja.maxY - caja.minY, 40);
	const margen = Math.max(ancho, alto) * 0.08 + 20;
	ancho += 2 * margen;
	alto += 2 * margen;
	if (ancho / alto < proporcion) {
		ancho = alto * proporcion;
	} else {
		alto = ancho / proporcion;
	}
	const centroX = (caja.minX + caja.maxX) / 2;
	const centroY = (caja.minY + caja.maxY) / 2;
	estado.vista = {x: centroX - ancho / 2, y: centroY - alto / 2, w: ancho, h: alto};
	aplicarVista();
}

function indicesEuropa() {
	return estado.red.nodes.map((n, i) => i).filter(i => estado.red.nodes[i].lon > -30);
}

function verEuropa() {
	ajustarVista(indicesEuropa());
	estado.vistaReferencia = {...estado.vista};
}

function aplicarVista() {
	const v = estado.vista;
	document.getElementById("mapa").setAttribute("viewBox", v.x + " " + v.y + " " + v.w + " " + v.h);
	pedirDibujo();
}

// Cuantas unidades del mapa mide un pixel de pantalla con el zoom actual.
function pixel() {
	const svg = document.getElementById("mapa");
	return estado.vista.w / (svg.clientWidth || 800);
}

function zoomEn(factor, x, y) {
	const v = estado.vista;
	const referencia = (estado.vistaReferencia || v).w;
	const nuevoAncho = Math.min(Math.max(v.w / factor, referencia / 25), referencia * 5);
	const real = v.w / nuevoAncho;
	v.x = x - (x - v.x) / real;
	v.y = y - (y - v.y) / real;
	v.w = nuevoAncho;
	v.h = v.h / real;
	aplicarVista();
}

function zoomAlCentro(factor) {
	const v = estado.vista;
	zoomEn(factor, v.x + v.w / 2, v.y + v.h / 2);
}

function aCoordenadasMapa(clienteX, clienteY) {
	const svg = document.getElementById("mapa");
	const punto = new DOMPoint(clienteX, clienteY).matrixTransform(svg.getScreenCTM().inverse());
	return [punto.x, punto.y];
}

function alRedimensionar() {
	if (!estado.vista) {
		return;
	}
	const svg = document.getElementById("mapa");
	const proporcion = (svg.clientWidth || 800) / (svg.clientHeight || 500);
	const v = estado.vista;
	const centroY = v.y + v.h / 2;
	v.h = v.w / proporcion;
	v.y = centroY - v.h / 2;
	aplicarVista();
}

/* =====================================================================
   4. Dibujo del mapa
   ===================================================================== */

let dibujoPendiente = false;
function pedirDibujo() {
	if (!dibujoPendiente) {
		dibujoPendiente = true;
		requestAnimationFrame(() => {
			dibujoPendiente = false;
			dibujarMapa();
		});
	}
}

function linea(capa, a, b, estilo, extra) {
	const elemento = crear("line", Object.assign({x1: a[0], y1: a[1], x2: b[0], y2: b[1], style: estilo}, extra || {}));
	capa.appendChild(elemento);
	return elemento;
}

// Triangulo en la mitad de un enlace que apunta en el sentido del flujo. El contorno del color
// del panel hace que se vea aunque este encima de una linea del mismo color.
function flecha(capa, a, b, color, tamano, contorno) {
	const mx = (a[0] + b[0]) / 2;
	const my = (a[1] + b[1]) / 2;
	const largo = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
	const ux = (b[0] - a[0]) / largo;
	const uy = (b[1] - a[1]) / largo;
	const puntas = [[mx + ux * tamano, my + uy * tamano], [mx - ux * tamano * 0.6 - uy * tamano * 0.7, my - uy * tamano * 0.6 + ux * tamano * 0.7], [mx - ux * tamano * 0.6 + uy * tamano * 0.7, my - uy * tamano * 0.6 - ux * tamano * 0.7]];
	const borde = contorno ? ";stroke:var(--panel);stroke-width:" + contorno + ";stroke-linejoin:round" : "";
	capa.appendChild(crear("polygon", {points: puntas.map(p => p.join(",")).join(" "), style: "fill:" + color + borde + ";pointer-events:none"}));
}

function equis(capa, centro, tamano, color) {
	const t = tamano;
	linea(capa, [centro[0] - t, centro[1] - t], [centro[0] + t, centro[1] + t], "stroke:" + color + ";stroke-width:" + (t * 0.45) + ";stroke-linecap:round");
	linea(capa, [centro[0] - t, centro[1] + t], [centro[0] + t, centro[1] - t], "stroke:" + color + ";stroke-width:" + (t * 0.45) + ";stroke-linecap:round");
}

function estiloEnlace(i, px) {
	const capa = estado.capa;
	const caido = !enlaceActivo(i);
	if (caido) {
		return {estilo: "stroke:var(--bad);stroke-width:" + 2.6 * px + ";stroke-dasharray:" + 7 * px + " " + 5 * px, color: null};
	}
	if (capa.flujo) {
		const detalle = capa.flujo.porEnlace[i];
		const uso = detalle && detalle.capacidad > 0 ? Math.abs(detalle.flujo) / detalle.capacidad : 0;
		if (uso <= 1e-9) {
			return {estilo: "stroke:var(--enlace);stroke-width:" + 1.4 * px + ";opacity:.55", color: null};
		}
		let color = uso >= 0.999 ? leerColor("--saturado") : mezclarColor(leerColor("--flujoBajo"), leerColor("--flujoAlto"), uso);
		if (capa.flujo.corte.has(i)) {
			color = leerColor("--corte");
		}
		return {estilo: "stroke:" + color + ";stroke-width:" + (2.2 + 6 * uso) * px + ";stroke-linecap:round", color, uso};
	}
	if (capa.mst && capa.mst.has(i)) {
		return {estilo: "stroke:var(--mst);stroke-width:" + 4.5 * px + ";stroke-linecap:round", color: null};
	}
	if (capa.criticos && capa.criticos.has(i)) {
		const peso = capa.criticos.get(i);
		return {estilo: "stroke:var(--critico);stroke-width:" + (2 + 6 * peso) * px + ";opacity:" + (0.35 + 0.65 * peso), color: null};
	}
	if (capa.propagacion && capa.propagacion.arbol.has(i)) {
		return {estilo: "stroke:var(--alcanzado);stroke-width:" + 1.8 * px + ";opacity:.35", color: null};
	}
	return {estilo: "stroke:var(--enlace);stroke-width:" + 1.7 * px, color: null};
}

function dibujarMapa() {
	if (!estado.red || !estado.vista) {
		return;
	}
	const capaEstatica = document.getElementById("capaEstatica");
	capaEstatica.textContent = "";
	const px = pixel();
	const P = estado.proyeccion;
	const capa = estado.capa;
	const muchos = estado.red.nodes.length > 60;

	// Celdas de Voronoi.
	(capa.celdas || []).forEach(celda => {
		const puntos = celda.puntos.map(p => proyectar(p[0], p[1]).join(",")).join(" ");
		capaEstatica.appendChild(crear("polygon", {points: puntos, style: "fill:var(--celda);fill-opacity:" + (celda.resaltar ? ".22" : ".08") + ";stroke:var(--celda);stroke-width:" + 1.2 * px}));
	});

	// Ruta del TSP o ruta anterior a la falla (debajo de los enlaces normales).
	if (capa.rutaFantasma) {
		const puntos = capa.rutaFantasma.map(i => P[i].join(",")).join(" ");
		capaEstatica.appendChild(crear("polyline", {points: puntos, style: "fill:none;stroke:var(--mute);stroke-width:" + 5 * px + ";stroke-dasharray:" + 2 * px + " " + 6 * px + ";stroke-linecap:round;opacity:.7"}));
	}

	// Enlaces: una linea visible y otra transparente y ancha para poder darles clic.
	const corte = capa.flujo ? capa.flujo.corte : new Set();
	estado.red.links.forEach((enlace, i) => {
		const a = P[enlace.u];
		const b = P[enlace.v];
		if (corte.has(i)) {
			linea(capaEstatica, a, b, "stroke:var(--corte);stroke-width:" + 18 * px + ";opacity:.22;stroke-linecap:round");
		}
		const {estilo, color, uso} = estiloEnlace(i, px);
		linea(capaEstatica, a, b, estilo);
		if (color && uso > 0) {
			const detalle = capa.flujo.porEnlace[i];
			const ida = detalle.flujo >= 0;
			flecha(capaEstatica, ida ? a : b, ida ? b : a, color, (6 + 3 * uso) * px, 1.6 * px);
		}
		if (!enlaceActivo(i) && estado.enlacesCaidos.has(i)) {
			equis(capaEstatica, [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], 5 * px, "var(--bad)");
		}
		linea(capaEstatica, a, b, "stroke:transparent;stroke-width:" + 14 * px, {"data-tipo": "enlace", "data-indice": i});
	});

	if (capa.ruta) {
		const puntos = capa.ruta.map(i => P[i].join(",")).join(" ");
		capaEstatica.appendChild(crear("polyline", {points: puntos, style: "fill:none;stroke:var(--ruta);stroke-width:" + 3.4 * px + ";stroke-linejoin:round;stroke-linecap:round;pointer-events:none"}));
		for (let k = 0; k + 1 < capa.ruta.length; k++) {
			flecha(capaEstatica, P[capa.ruta[k]], P[capa.ruta[k + 1]], "var(--ruta)", 5 * px);
		}
	}

	dibujarNodos(capaEstatica, px, muchos);
	dibujarCapaDinamica();
	actualizarLeyenda();
}

// Acomoda las etiquetas para que no se encimen: prueba ocho posiciones alrededor de cada nodo y
// se queda con la que menos choca con otras etiquetas y con otros nodos. Si hay simulacion, cada
// etiqueta reserva dos lineas: el nombre y, debajo, el tiempo de llegada.
function colocarEtiquetas(px, radios, textos, conTiempo) {
	const P = estado.proyeccion;
	const tamano = 11.5 * px;
	const ocupado = estado.red.nodes.map((n, i) => {
		const r = radios[i] + 1.5 * px;
		return [P[i][0] - r, P[i][1] - r, P[i][0] + r, P[i][1] + r];
	});
	const choque = (a, b) => Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])) * Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
	const grado = estado.red.nodes.map(() => 0);
	estado.red.links.forEach(l => { grado[l.u]++; grado[l.v]++; });
	const prioridad = i => (i === estado.origen || i === estado.destino ? 1000 : 0) + grado[i];
	const resultado = {};
	Object.keys(textos).map(Number).sort((a, b) => prioridad(b) - prioridad(a)).forEach(i => {
		const p = P[i];
		const r = radios[i];
		const ancho = Math.max(textos[i].length, conTiempo ? 7 : 0) * tamano * 0.58 + 2 * px;
		const alto = tamano * (conTiempo ? 2.2 : 1.2);
		const separacion = 3 * px;
		const candidatos = [
			[p[0] + r + separacion, p[1] - r - alto + tamano * 0.4],
			[p[0] + r + separacion, p[1] - alto / 2],
			[p[0] + r + separacion, p[1] + r - tamano * 0.3],
			[p[0] - r - separacion - ancho, p[1] - r - alto + tamano * 0.4],
			[p[0] - r - separacion - ancho, p[1] - alto / 2],
			[p[0] - r - separacion - ancho, p[1] + r - tamano * 0.3],
			[p[0] - ancho / 2, p[1] - r - separacion - alto],
			[p[0] - ancho / 2, p[1] + r + separacion]
		];
		let mejor = null;
		let menorChoque = Infinity;
		candidatos.forEach(([x, y]) => {
			if (menorChoque > 0) {
				const caja = [x, y, x + ancho, y + alto];
				const total = ocupado.reduce((suma, otra, k) => suma + (k === i ? 0 : choque(caja, otra)), 0);
				if (total < menorChoque) {
					menorChoque = total;
					mejor = caja;
				}
			}
		});
		ocupado.push(mejor);
		resultado[i] = {x: mejor[0] + px, y1: mejor[1] + tamano * 0.92, y2: mejor[1] + tamano * 2.0};
	});
	return resultado;
}

function radioBase(muchos, px) {
	return (muchos ? 3 : 5.5) * px;
}

function dibujarNodos(capaDestino, px, muchos) {
	const P = estado.proyeccion;
	const capa = estado.capa;
	const cargaMaxima = Math.max(1, ...estado.red.nodes.map(n => n.load));
	const mostrarEtiquetas = !muchos || estado.vista.w < (estado.vistaReferencia || estado.vista).w / 3;
	const radios = estado.red.nodes.map(nodo => capa.porTrafico ? (muchos ? 2.5 : 4) * px + Math.sqrt(nodo.load / cargaMaxima) * (muchos ? 4 : 9) * px : radioBase(muchos, px));
	const textos = {};
	if (mostrarEtiquetas) {
		estado.red.nodes.forEach((nodo, i) => {
			let texto = nombreCorto(i);
			if (capa.mostrarExtremos && i === estado.origen) {
				texto += " · origen";
			} else if (capa.mostrarExtremos && capa.usaDestino && i === estado.destino) {
				texto += " · destino";
			}
			textos[i] = texto;
		});
	}
	estado.etiquetas = colocarEtiquetas(px, radios, textos, Boolean(capa.propagacion) && !muchos);
	estado.red.nodes.forEach((nodo, i) => {
		const p = P[i];
		const caido = estado.nodosCaidos.has(i);
		let radio = radios[i];
		let estilo = "fill:var(--nodo)";
		if (capa.porTrafico) {
			estilo = "fill:var(--acc);fill-opacity:.85";
		}
		if (capa.flujo) {
			estilo = capa.flujo.ladoFuente.has(i) ? "fill:var(--acc)" : "fill:var(--inactivo)";
		}
		if (capa.propagacion) {
			estilo = "fill:var(--inactivo)";
			if (capa.propagacion.inalcanzables.has(i)) {
				estilo = "fill:var(--panel);stroke:var(--bad);stroke-width:" + 2.2 * px;
			}
		}
		if (capa.resaltados && capa.resaltados.has(i)) {
			estilo = "fill:var(--acc2)";
			radio *= 1.3;
		}
		if (caido) {
			estilo = "fill:var(--inactivo)";
		}
		const grupo = crear("g", {"data-tipo": "nodo", "data-indice": i});
		grupo.appendChild(crear("circle", {cx: p[0], cy: p[1], r: Math.max(radio, 9 * px), style: "fill:transparent"}));
		grupo.appendChild(crear("circle", {cx: p[0], cy: p[1], r: radio, style: estilo, "data-nodo": i}));
		if (caido) {
			equis(grupo, p, radio * 1.15, "var(--bad)");
		}
		if (capa.mostrarExtremos && i === estado.origen) {
			grupo.appendChild(crear("circle", {cx: p[0], cy: p[1], r: radio + 4.5 * px, style: "fill:none;stroke:var(--acc2);stroke-width:" + 3 * px}));
		}
		if (capa.mostrarExtremos && capa.usaDestino && i === estado.destino) {
			grupo.appendChild(crear("circle", {cx: p[0], cy: p[1], r: radio + 4.5 * px, style: "fill:none;stroke:var(--acc2);stroke-width:" + 2 * px + ";stroke-dasharray:" + 3 * px + " " + 2.5 * px}));
		}
		const etiqueta = estado.etiquetas[i];
		if (etiqueta) {
			grupo.appendChild(crear("text", {x: etiqueta.x, y: etiqueta.y1, style: "font-size:" + 11.5 * px + "px;fill:var(--ink);paint-order:stroke;stroke:var(--mar);stroke-width:" + 3.2 * px + "px;stroke-linejoin:round;pointer-events:none"}, textos[i]));
		}
		capaDestino.appendChild(grupo);
	});
}

function actualizarLeyenda() {
	const leyenda = document.getElementById("leyenda");
	leyenda.textContent = "";
	const capa = estado.capa;
	const filas = [];
	if (capa.flujo) {
		const usos = capa.flujo.porEnlace.map((d, i) => ({i, uso: d.capacidad > 0 ? Math.abs(d.flujo) / d.capacidad : 0}));
		if (usos.some(u => u.uso > 1e-9 && u.uso < 0.999)) {
			filas.push(["gradiente", "Flujo parcial: poco → mucho"]);
		}
		if (usos.some(u => u.uso >= 0.999 && !capa.flujo.corte.has(u.i))) {
			filas.push(["linea", "var(--saturado)", "Enlace lleno (100 %)"]);
		}
		if (capa.flujo.corte.size) {
			filas.push(["linea", "var(--corte)", "Corte mínimo: el cuello de botella"]);
		}
		filas.push(["linea", "var(--enlace)", "Enlace sin flujo"]);
		filas.push(["punto", "var(--acc)", "Lado del origen en el corte"]);
	}
	if (capa.mst) {
		filas.push(["linea", "var(--mst)", "Árbol de expansión mínima"]);
	}
	if (capa.ruta) {
		filas.push(["linea", "var(--ruta)", "Ruta de mantenimiento"]);
	}
	if (capa.propagacion) {
		filas.push(["punto", "var(--paquete)", "Mensaje viajando"]);
		filas.push(["punto", "var(--alcanzado)", "Nodo que ya lo recibió"]);
		filas.push(["punto", "var(--inactivo)", "Todavía no lo recibe"]);
		if (capa.rutaFantasma) {
			filas.push(["linea", "var(--mute)", "Ruta que usaba antes de la falla"]);
		}
	}
	if (capa.criticos) {
		filas.push(["linea", "var(--critico)", "Enlace crítico (más grueso = más daño)"]);
	}
	if (hayFallas()) {
		filas.push(["linea", "var(--bad)", "Enlace o nodo caído"]);
	}
	filas.forEach(fila => {
		const div = crear("div");
		if (fila[0] === "gradiente") {
			div.appendChild(crear("b", {class: "barraGradiente", style: "background:linear-gradient(90deg,var(--flujoBajo),var(--flujoAlto))"}));
			div.appendChild(document.createTextNode(fila[1]));
		} else if (fila[0] === "linea") {
			div.appendChild(crear("i", {style: "border-color:" + fila[1]}));
			div.appendChild(document.createTextNode(fila[2]));
		} else {
			div.appendChild(crear("b", {class: "punto", style: "background:" + fila[1]}));
			div.appendChild(document.createTextNode(fila[2]));
		}
		leyenda.appendChild(div);
	});
}

function ponerEstadoMapa(texto) {
	document.getElementById("estadoMapa").textContent = texto || "";
}

/* =====================================================================
   5. Interaccion con el mapa: clic, arrastre, zoom y tooltip
   ===================================================================== */

const punteros = new Map();
let gesto = null;

function objetivoDe(evento) {
	const elemento = evento.target.closest ? evento.target.closest("[data-tipo]") : null;
	return elemento ? {tipo: elemento.getAttribute("data-tipo"), indice: +elemento.getAttribute("data-indice")} : null;
}

function alPresionar(evento) {
	const svg = document.getElementById("mapa");
	svg.setPointerCapture(evento.pointerId);
	punteros.set(evento.pointerId, [evento.clientX, evento.clientY]);
	if (punteros.size === 1) {
		gesto = {tipo: "clic", inicio: [evento.clientX, evento.clientY], ultimo: [evento.clientX, evento.clientY], objetivo: objetivoDe(evento)};
	} else if (punteros.size === 2) {
		const [a, b] = [...punteros.values()];
		gesto = {tipo: "pellizco", distancia: Math.hypot(a[0] - b[0], a[1] - b[1])};
	}
}

function alMover(evento) {
	if (!punteros.has(evento.pointerId)) {
		mostrarTooltip(evento);
		return;
	}
	punteros.set(evento.pointerId, [evento.clientX, evento.clientY]);
	const svg = document.getElementById("mapa");
	if (gesto && gesto.tipo === "pellizco" && punteros.size === 2) {
		const [a, b] = [...punteros.values()];
		const distancia = Math.hypot(a[0] - b[0], a[1] - b[1]);
		const centro = aCoordenadasMapa((a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
		if (gesto.distancia > 0) {
			zoomEn(distancia / gesto.distancia, centro[0], centro[1]);
		}
		gesto.distancia = distancia;
	} else if (gesto) {
		const movido = Math.hypot(evento.clientX - gesto.inicio[0], evento.clientY - gesto.inicio[1]);
		if (gesto.tipo === "clic" && movido > 5) {
			gesto.tipo = "arrastre";
			svg.classList.add("arrastrando");
			ocultarTooltip();
		}
		if (gesto.tipo === "arrastre") {
			const escala = pixel();
			estado.vista.x -= (evento.clientX - gesto.ultimo[0]) * escala;
			estado.vista.y -= (evento.clientY - gesto.ultimo[1]) * escala;
			gesto.ultimo = [evento.clientX, evento.clientY];
			aplicarVista();
		}
	}
}

function alSoltar(evento) {
	const svg = document.getElementById("mapa");
	punteros.delete(evento.pointerId);
	svg.classList.remove("arrastrando");
	if (gesto && gesto.tipo === "clic" && gesto.objetivo && punteros.size === 0) {
		alHacerClic(gesto.objetivo);
	}
	if (punteros.size === 0) {
		gesto = null;
	}
}

function alHacerClic(objetivo) {
	if (estado.modoClic === "fallar") {
		if (objetivo.tipo === "enlace") {
			alternarFallaEnlace(objetivo.indice);
		} else {
			alternarFallaNodo(objetivo.indice);
		}
	} else if (objetivo.tipo === "nodo") {
		if (estado.modoClic === "origen") {
			estado.origen = objetivo.indice;
			avisar("Origen: " + nombreLargo(objetivo.indice));
		} else {
			estado.destino = objetivo.indice;
			avisar("Destino: " + nombreLargo(objetivo.indice));
		}
		sincronizarSelectores();
		if (estado.recalcular) {
			estado.recalcular();
		}
		pedirDibujo();
	} else {
		avisar("Para tirar este enlace, elige «Provocar falla» arriba del mapa");
	}
}

function alGirarRueda(evento) {
	evento.preventDefault();
	const punto = aCoordenadasMapa(evento.clientX, evento.clientY);
	zoomEn(Math.exp(-evento.deltaY * 0.0015), punto[0], punto[1]);
}

function mostrarTooltip(evento) {
	const objetivo = objetivoDe(evento);
	const tooltip = document.getElementById("tooltip");
	if (!objetivo) {
		ocultarTooltip();
		return;
	}
	tooltip.textContent = "";
	if (objetivo.tipo === "nodo") {
		const i = objetivo.indice;
		const nodo = estado.red.nodes[i];
		tooltip.appendChild(crear("strong", {}, nombreLargo(i)));
		tooltip.appendChild(crear("span", {}, "Tráfico: " + formatoMiles(nodo.load) + " Mbit/s"));
		const grado = estado.red.links.filter(l => l.u === i || l.v === i).length;
		tooltip.appendChild(crear("span", {}, grado + " enlaces"));
		const info = estado.capa.propagacion && estado.capa.propagacion.porNodo[i];
		if (info && info.reachable) {
			tooltip.appendChild(crear("span", {}, "El mensaje llega en " + formatoMs(info.time) + " (" + info.hops + " saltos)"));
		}
		if (estado.nodosCaidos.has(i)) {
			tooltip.appendChild(crear("span", {class: "bad"}, "Nodo caído"));
		}
	} else {
		const i = objetivo.indice;
		const enlace = estado.red.links[i];
		tooltip.appendChild(crear("strong", {}, nombreCorto(enlace.u) + " – " + nombreCorto(enlace.v)));
		tooltip.appendChild(crear("span", {}, formatoMiles(enlace.capacity) + " Mbit/s · costo " + formatoMiles(enlace.cost)));
		tooltip.appendChild(crear("span", {}, formatoMiles(enlace.km) + " km · retardo " + formatoMs(enlace.delay)));
		const detalle = estado.capa.flujo && estado.capa.flujo.porEnlace[i];
		if (detalle) {
			tooltip.appendChild(crear("span", {}, "Flujo: " + formatoMiles(Math.abs(detalle.flujo)) + " Mbit/s (" + Math.round(100 * Math.abs(detalle.flujo) / Math.max(detalle.capacidad, 1)) + " %)"));
		}
		if (!enlaceActivo(i)) {
			tooltip.appendChild(crear("span", {class: "bad"}, "Enlace caído"));
		}
	}
	const caja = document.getElementById("lienzo").getBoundingClientRect();
	let x = evento.clientX - caja.left + 14;
	let y = evento.clientY - caja.top + 14;
	tooltip.style.display = "block";
	if (x + tooltip.offsetWidth > caja.width - 8) {
		x = evento.clientX - caja.left - tooltip.offsetWidth - 14;
	}
	if (y + tooltip.offsetHeight > caja.height - 8) {
		y = evento.clientY - caja.top - tooltip.offsetHeight - 14;
	}
	tooltip.style.left = x + "px";
	tooltip.style.top = y + "px";
}

function ocultarTooltip() {
	document.getElementById("tooltip").style.display = "none";
}

function prepararMapa() {
	const svg = document.getElementById("mapa");
	svg.addEventListener("pointerdown", alPresionar);
	svg.addEventListener("pointermove", alMover);
	svg.addEventListener("pointerup", alSoltar);
	svg.addEventListener("pointercancel", alSoltar);
	svg.addEventListener("pointerleave", evento => {
		if (!punteros.size) {
			ocultarTooltip();
		}
	});
	svg.addEventListener("wheel", alGirarRueda, {passive: false});
	svg.addEventListener("dblclick", evento => {
		const punto = aCoordenadasMapa(evento.clientX, evento.clientY);
		zoomEn(1.8, punto[0], punto[1]);
	});
	svg.addEventListener("keydown", evento => {
		const paso = 40 * pixel();
		const acciones = {"+": () => zoomAlCentro(1.3), "=": () => zoomAlCentro(1.3), "-": () => zoomAlCentro(1 / 1.3), "0": verEuropa,
			ArrowLeft: () => { estado.vista.x -= paso; aplicarVista(); }, ArrowRight: () => { estado.vista.x += paso; aplicarVista(); },
			ArrowUp: () => { estado.vista.y -= paso; aplicarVista(); }, ArrowDown: () => { estado.vista.y += paso; aplicarVista(); }};
		if (acciones[evento.key]) {
			evento.preventDefault();
			acciones[evento.key]();
		}
	});
	document.getElementById("zoomMas").onclick = () => zoomAlCentro(1.4);
	document.getElementById("zoomMenos").onclick = () => zoomAlCentro(1 / 1.4);
	document.getElementById("verEuropa").onclick = verEuropa;
	document.getElementById("verTodo").onclick = () => ajustarVista([]);
	document.querySelectorAll("#modoClic button").forEach(boton => {
		boton.onclick = () => {
			estado.modoClic = boton.getAttribute("data-modo");
			document.querySelectorAll("#modoClic button").forEach(b => b.setAttribute("aria-pressed", String(b === boton)));
		};
	});
	new ResizeObserver(alRedimensionar).observe(document.getElementById("lienzo"));
}

		boton.onclick = evento => {
			evento.stopPropagation();
			const abierto = grupo.classList.contains("abierto");
			cerrarMenus();
			if (!abierto) {
				grupo.classList.add("abierto");
				boton.setAttribute("aria-expanded", "true");
			}
		};
		boton.onkeydown = evento => {
			if (evento.key === "ArrowDown") {
				evento.preventDefault();
				grupo.classList.add("abierto");
				boton.setAttribute("aria-expanded", "true");
				const primero = desplegable.querySelector(".opcion");
				if (primero) {
					primero.focus();
				}
			}
		};
		desplegable.onkeydown = evento => {
			const items = [...desplegable.querySelectorAll(".opcion")];
			const posicion = items.indexOf(document.activeElement);
			if (evento.key === "ArrowDown" && posicion < items.length - 1) {
				evento.preventDefault();
				items[posicion + 1].focus();
			} else if (evento.key === "ArrowUp") {
				evento.preventDefault();
				(posicion > 0 ? items[posicion - 1] : boton).focus();
			}
		};
		grupo.append(boton, desplegable);
		nav.appendChild(grupo);
	});
}

// Ejecuta muchas consultas al programa de pocas en pocas, para no abrir cientos de procesos a la vez.
async function ejecutarEnLotes(pedidos, tamano) {
	const respuestas = [];
	for (let k = 0; k < pedidos.length; k += tamano) {
		const lote = await Promise.all(pedidos.slice(k, k + tamano).map(p => ejecutar(p.modo, p.entrada)));
		lote.forEach(r => respuestas.push(r));
	}
	return respuestas;
}

// Corre todas las tecnicas de un modo y muestra tiempo y resultado de cada una.
async function compararTecnicas(contenedor, tecnicas, armar, resumir) {
	contenedor.textContent = "Comparando técnicas con el programa en C++…";
	const filas = [];
	for (const [clave, nombre] of tecnicas) {
		const {salida, ms} = await ejecutar(armar.modo, Object.assign({}, armar.entrada(), {algorithm: clave}));
		filas.push([nombre, salida.error ? "error" : resumir(salida), ms.toFixed(1)]);
	}
	contenedor.textContent = "";
	contenedor.appendChild(crear("h3", {}, "Comparación de técnicas"));
	contenedor.appendChild(tabla(["Técnica", "Resultado", "Tiempo (ms)"], filas, {numericas: [2]}));
	contenedor.appendChild(crear("p", {class: "nota"}, "El tiempo incluye ida y vuelta al programa. Con una red de este tamaño casi todo es costo fijo; las diferencias reales se ven en results/benchmarks.md."));
}

/* ---------- 7.2 Arbol de expansion minima ---------- */
HERRAMIENTAS.mst = tablero => {
	const s = seccion(tablero, "Árbol de expansión mínima", "Conecta todos los nodos usando los enlaces más baratos, sin ciclos. El costo de SNDlib en GÉANT es la distancia en km.");
	const tecnica = campo(s, "Técnica", selectorOpciones([["kruskal", "Kruskal + Union-Find (por defecto)"], ["prim", "Prim con cola de prioridad"]]));
	const botones = crear("div", {class: "botones"});
	const calcular = crear("button", {class: "btn"}, "Calcular");
	const comparar = crear("button", {class: "btn sec"}, "Comparar técnicas");
	botones.append(calcular, comparar);
	s.appendChild(botones);
	const resultado = crear("div");
	s.appendChild(resultado);
	const entrada = () => {
		const activos = indicesEnlacesActivos();
		return {nodes: indicesNodosActivos(), edges: activos.map(i => [estado.red.links[i].u, estado.red.links[i].v, estado.red.links[i].cost])};
	};
	async function correr() {
		const {salida, ms} = await ejecutar("mst", Object.assign(entrada(), {algorithm: tecnica.value}));
		if (salida.error) {
			mostrarError(resultado, salida);
			return;
		}
		const buscar = buscadorDeEnlaces(indicesEnlacesActivos());
		estado.capa = {mst: new Set(salida.edges.map(e => buscar(e[0], e[1])))};
		resultado.textContent = "";
		resultado.appendChild(crear("p", {class: "grande"}, formatoMiles(salida.totalCost) + " km"));
		resultado.appendChild(crear("p", {class: "nota"}, "Costo total con " + salida.algorithm + ": " + salida.edges.length + " enlaces de " + indicesEnlacesActivos().length + " disponibles (" + ms.toFixed(1) + " ms)."));
		resultado.appendChild(crear("p", {class: salida.connected ? "ok" : "bad"}, salida.connected ? "La red queda conectada." : "La red quedó partida: con estas fallas no hay forma de conectar todos los nodos."));
		notaFallas(resultado);
		ponerEstadoMapa("En verde: los enlaces del árbol de expansión mínima. Prueba tirar uno con «Provocar falla» y mira cómo se reacomoda.");
		pedirDibujo();
	}
	calcular.onclick = correr;
	comparar.onclick = () => compararTecnicas(resultado, [["kruskal", "Kruskal"], ["prim", "Prim"]], {modo: "mst", entrada}, salida => formatoMiles(salida.totalCost) + " km");
	estado.recalcular = correr;
	correr();
};

/* ---------- 7.3 Ruta de mantenimiento (TSP) ---------- */
HERRAMIENTAS.tsp = tablero => {
	const s = seccion(tablero, "Ruta de mantenimiento", "Recorre todos los nodos y regresa al inicio con el menor costo. Hasta 16 nodos usa el exacto; con más, la aproximación.");
	const tecnica = campo(s, "Técnica", selectorOpciones([["", "Automática (exacto si n ≤ 16)"], ["heldkarp", "Held-Karp (exacto)"], ["2opt", "Vecino más cercano + 2-opt"], ["nn", "Solo vecino más cercano"]]));
	const botones = crear("div", {class: "botones"});
	const calcular = crear("button", {class: "btn"}, "Calcular ruta");
	const comparar = crear("button", {class: "btn sec"}, "Comparar técnicas");
	botones.append(calcular, comparar);
	s.appendChild(botones);
	const resultado = crear("div");
	s.appendChild(resultado);
	const entrada = () => {
		const activos = indicesEnlacesActivos();
		return {nodes: indicesNodosActivos(), edges: activos.map(i => [estado.red.links[i].u, estado.red.links[i].v, estado.red.links[i].cost])};
	};
	async function correr() {
		const pedido = entrada();
		if (tecnica.value) {
			pedido.algorithm = tecnica.value;
		}
		const {salida, ms} = await ejecutar("tsp", pedido);
		if (salida.error) {
			estado.capa = {};
			mostrarError(resultado, salida);
			resultado.appendChild(crear("p", {class: "nota"}, "Si hay fallas, puede que la red haya quedado partida y ya no exista una ruta que pase por todos."));
			pedirDibujo();
			return;
		}
		// Dos nodos seguidos de la ruta pueden no tener enlace directo: el C++ completa esas distancias
		// con Floyd-Warshall. Para dibujar por donde pasa de verdad, se le pide al C++ el camino mas
		// corto de cada tramo indirecto (modo propagation), y el mapa solo traza enlaces que existen.
		const directos = new Set(indicesEnlacesActivos().map(i => {
			const enlace = estado.red.links[i];
			return Math.min(enlace.u, enlace.v) + "-" + Math.max(enlace.u, enlace.v);
		}));
		const tramos = [];
		for (let k = 0; k + 1 < salida.route.length; k++) {
			tramos.push([salida.route[k], salida.route[k + 1]]);
		}
		const indirectos = tramos.filter(([a, b]) => !directos.has(Math.min(a, b) + "-" + Math.max(a, b)));
		const caminos = await ejecutarEnLotes(indirectos.map(([a, b]) => ({modo: "propagation", entrada: entradaPropagacion({origen: a, destino: b, metrica: "weight", tecnica: "dijkstra", procesamiento: 0}, true)})), 8);
		const porTramo = new Map();
		indirectos.forEach(([a, b], k) => porTramo.set(a + ">" + b, caminos[k].salida.path && caminos[k].salida.path.length ? caminos[k].salida.path : [a, b]));
		const recorrido = [salida.route[0]];
		tramos.forEach(([a, b]) => (porTramo.get(a + ">" + b) || [a, b]).slice(1).forEach(x => recorrido.push(x)));
		estado.capa = {ruta: recorrido};
		resultado.textContent = "";
		resultado.appendChild(crear("p", {class: "grande"}, formatoMiles(salida.cost) + " km"));
		resultado.appendChild(crear("p", {class: "nota"}, "Técnica usada: " + salida.algorithm + " (" + ms.toFixed(1) + " ms)."));
		resultado.appendChild(crear("h3", {}, "Orden de visita"));
		resultado.appendChild(crear("p", {}, salida.route.map(nombreCorto).join(" → ")));
		if (indirectos.length) {
			resultado.appendChild(crear("p", {class: "nota"}, indirectos.length + " de " + tramos.length + " tramos no tienen enlace directo; en el mapa siguen el camino más corto real, así que el equipo pasa de largo por algunos nodos. En total recorre " + (recorrido.length - 1) + " enlaces."));
		}
		notaFallas(resultado);
		ponerEstadoMapa("En naranja: la ruta de mantenimiento, siempre por enlaces que existen. Las flechas marcan el sentido del recorrido.");
		pedirDibujo();
	}
	calcular.onclick = correr;
	comparar.onclick = () => compararTecnicas(resultado, [["heldkarp", "Held-Karp"], ["2opt", "Vecino + 2-opt"], ["nn", "Vecino más cercano"]], {modo: "tsp", entrada}, salida => formatoMiles(salida.cost) + " km");
	estado.recalcular = correr;
	correr();
};

/* ---------- 7.4 Flujo maximo, pintado en el mapa ---------- */
HERRAMIENTAS.flujo = tablero => {
	const s = seccion(tablero, "Flujo máximo", "Cuántos datos caben del origen al destino sin pasar la capacidad de ningún enlace. El mapa pinta cuánto lleva cada enlace.");
	const fila = crear("div", {class: "fila"});
	const izquierda = crear("div");
	const derecha = crear("div");
	campo(izquierda, "Origen", selectorNodo("origen"));
	campo(derecha, "Destino", selectorNodo("destino"));
	fila.append(izquierda, derecha);
	s.appendChild(fila);
	const tecnica = campo(s, "Técnica", selectorOpciones([["dinic", "Dinic (por defecto)"], ["edmondskarp", "Edmonds-Karp"]]));
	const botones = crear("div", {class: "botones"});
	const calcular = crear("button", {class: "btn"}, "Calcular flujo");
	const comparar = crear("button", {class: "btn sec"}, "Comparar técnicas");
	botones.append(calcular, comparar);
	s.appendChild(botones);
	const resultado = crear("div");
	s.appendChild(resultado);
	async function correr() {
		if (estado.origen === estado.destino) {
			resultado.textContent = "";
			resultado.appendChild(crear("p", {class: "bad"}, "El origen y el destino son el mismo nodo."));
			estado.capa = {mostrarExtremos: true, usaDestino: true};
			pedirDibujo();
			return;
		}
		const {salida, ms} = await ejecutar("maxflow", Object.assign(entradaFlujo(estado.origen, estado.destino), {algorithm: tecnica.value}));
		if (salida.error) {
			mostrarError(resultado, salida);
			return;
		}
		if (!salida.flows) {
			estado.capa = {mostrarExtremos: true, usaDestino: true};
			resultado.textContent = "";
			resultado.appendChild(crear("p", {class: "grande"}, formatoMiles(salida.maxFlow) + " Mbit/s"));
			resultado.appendChild(crear("p", {class: "aviso"}, "El servidor está usando la versión del autograder, que no trae el flujo por enlace. Para pintarlo en el mapa compila la versión de la app: g++ -std=c++17 -O2 -DSENTINEL_APP src/main.cpp -o sentinel_app"));
			pedirDibujo();
			return;
		}
		estado.capa = {
			mostrarExtremos: true,
			usaDestino: true,
			flujo: {
				porEnlace: salida.flows.map(f => ({flujo: f[2], capacidad: f[3]})),
				corte: new Set(salida.minCut.map(c => c[3])),
				ladoFuente: new Set(salida.sourceSide)
			}
		};
		resultado.textContent = "";
		resultado.appendChild(crear("p", {class: "grande"}, formatoMiles(salida.maxFlow) + " Mbit/s"));
		const capacidad = estado.red.links[0].capacity;
		resultado.appendChild(crear("p", {class: "nota"}, "De " + nombreLargo(estado.origen) + " a " + nombreLargo(estado.destino) + " con " + salida.algorithm + " (" + ms.toFixed(1) + " ms). Equivale a " + (salida.maxFlow / capacidad).toFixed(1).replace(".0", "") + " enlaces de " + formatoMiles(capacidad / 1000) + " Gbit/s llenos."));
		resultado.appendChild(crear("h3", {}, "Corte mínimo: el cuello de botella"));
		resultado.appendChild(crear("p", {class: "nota"}, "Estos " + salida.minCut.length + " enlaces suman " + formatoMiles(salida.minCutCapacity) + " Mbit/s, exactamente el flujo máximo. Si se cortan todos, el origen queda separado del destino."));
		const listaCorte = crear("ul", {class: "lista"});
		salida.minCut.forEach(c => listaCorte.appendChild(crear("li", {}, nombreLargo(c[0]) + " – " + nombreLargo(c[1]) + " (" + formatoMiles(c[2]) + " Mbit/s)")));
		resultado.appendChild(listaCorte);
		const usados = salida.flows.map((f, i) => ({i, flujo: Math.abs(f[2]), capacidad: f[3]})).filter(x => x.flujo > 0).sort((a, b) => b.flujo - a.flujo);
		resultado.appendChild(crear("h3", {}, "Enlaces que llevan flujo (" + usados.length + ")"));
		resultado.appendChild(tabla(["Enlace", "Flujo (Mbit/s)", "Uso"], usados.slice(0, 12).map(x => {
			const enlace = estado.red.links[x.i];
			return [nombreCorto(enlace.u) + " – " + nombreCorto(enlace.v), formatoMiles(x.flujo), Math.round(100 * x.flujo / x.capacidad) + " %"];
		}), {numericas: [1, 2]}));
		notaFallas(resultado);
		ponerEstadoMapa("Naranja = enlace lleno; morado = corte mínimo; las flechas marcan hacia dónde va el flujo. Prueba tirar un enlace del corte y vuelve a mirar.");
		pedirDibujo();
	}
	calcular.onclick = correr;
	comparar.onclick = () => compararTecnicas(resultado, [["dinic", "Dinic"], ["edmondskarp", "Edmonds-Karp"]], {modo: "maxflow", entrada: () => entradaFlujo(estado.origen, estado.destino)}, salida => formatoMiles(salida.maxFlow) + " Mbit/s");
	estado.recalcular = correr;
	correr();
};

/* ---------- 7.5 Zonas de cobertura (Voronoi) ---------- */
HERRAMIENTAS.voronoi = tablero => {
	const s = seccion(tablero, "Zonas de cobertura", "Cada celda es la zona que queda más cerca de un nodo que de cualquier otro. Si un nodo cae, sus vecinos se reparten su zona.");
	const tecnica = campo(s, "Técnica", selectorOpciones([["clipping", "Recorte por semiplanos (por defecto)"], ["sorted", "Vecinos ordenados"]]));
	const botones = crear("div", {class: "botones"});
	const calcular = crear("button", {class: "btn"}, "Calcular zonas");
	const comparar = crear("button", {class: "btn sec"}, "Comparar técnicas");
	botones.append(calcular, comparar);
	s.appendChild(botones);
	const resultado = crear("div");
	s.appendChild(resultado);
	const entrada = () => {
		const nodos = estado.red.nodes;
		const longitudes = nodos.map(n => n.lon);
		const latitudes = nodos.map(n => n.lat);
		return {sites: indicesNodosActivos().map(i => [nodos[i].lon, nodos[i].lat]),
			bounds: [Math.min(...longitudes) - 3, Math.min(...latitudes) - 3, Math.max(...longitudes) + 3, Math.max(...latitudes) + 3]};
	};
	async function correr() {
		const activos = indicesNodosActivos();
		const {salida, ms} = await ejecutar("voronoi", Object.assign(entrada(), {algorithm: tecnica.value}));
		if (salida.error) {
			mostrarError(resultado, salida);
			return;
		}
		estado.capa = {celdas: salida.cells.map((puntos, k) => ({puntos, nodo: activos[k]}))};
		const areas = salida.regions.map((r, k) => ({nodo: activos[k], area: r.area})).sort((a, b) => b.area - a.area);
		resultado.textContent = "";
		resultado.appendChild(crear("p", {class: "grande"}, salida.cells.length + " zonas"));
		resultado.appendChild(crear("p", {class: "nota"}, "Calculado con " + salida.algorithm + " en " + ms.toFixed(1) + " ms. Las áreas están en grados² de longitud y latitud (sin proyección)."));
		resultado.appendChild(crear("h3", {}, "Zonas más grandes"));
		resultado.appendChild(tabla(["Nodo", "Área (grados²)"], areas.slice(0, 8).map(a => [nombreLargo(a.nodo), a.area.toFixed(1)]), {numericas: [1]}));
		notaFallas(resultado);
		ponerEstadoMapa("Cada polígono azul es la zona de un nodo. Tira un nodo con «Provocar falla» para ver quién absorbe su zona.");
		pedirDibujo();
	}
	calcular.onclick = correr;
	comparar.onclick = () => compararTecnicas(resultado, [["clipping", "Recorte directo"], ["sorted", "Vecinos ordenados"]], {modo: "voronoi", entrada}, salida => salida.cells.length + " zonas");
	estado.recalcular = correr;
	correr();
};

/* ---------- 7.6 Propagacion de un mensaje (estilo Packet Tracer) ---------- */
const MS_REALES_POR_MS_SIMULADO = 160;
const VELOCIDADES = [0.25, 0.5, 1, 2, 4, 8];

HERRAMIENTAS.propagacion = tablero => {
	const s = seccion(tablero, "Propagación de un mensaje", "Sale un mensaje del origen y viaja salto por salto. El tiempo es real: la distancia del enlace entre la velocidad de la luz en la fibra (200 km por ms) más el procesamiento de cada router.");
	const tipo = crear("div", {class: "segmentado", role: "group", "aria-label": "Tipo de mensaje"});
	const difusion = crear("button", {"aria-pressed": "true"}, "A toda la red");
	const unicast = crear("button", {"aria-pressed": "false"}, "A un destino");
	tipo.append(difusion, unicast);
	s.appendChild(crear("label", {}, "Tipo de mensaje"));
	s.appendChild(tipo);
	const fila = crear("div", {class: "fila"});
	const izquierda = crear("div");
	const derecha = crear("div");
	campo(izquierda, "Origen", selectorNodo("origen"));
	campo(derecha, "Destino", selectorNodo("destino"));
	fila.append(izquierda, derecha);
	s.appendChild(fila);
	const metrica = campo(s, "Cómo eligen la ruta los routers", selectorOpciones([["time", "Menor tiempo de llegada (latencia + procesamiento)"], ["hops", "Menos saltos (como RIP)"], ["weight", "Costo de SNDlib (como OSPF)"]]));
	const tecnica = campo(s, "Algoritmo", selectorOpciones([["dijkstra", "Dijkstra (estado de enlace, OSPF)"], ["bellmanford", "Bellman-Ford (vector distancia, RIP)"]]));
	const procesamientoValor = crear("span", {class: "pill"});
	const procesamiento = crear("input", {type: "range", min: 0, max: 20, step: 0.5, value: estado.red.hopDelay !== undefined ? estado.red.hopDelay : 1});
	const etiquetaProcesamiento = crear("label", {}, "Procesamiento en cada router ");
	etiquetaProcesamiento.appendChild(procesamientoValor);
	s.append(etiquetaProcesamiento, procesamiento);
	const velocidadValor = crear("span", {class: "pill"});
	const velocidad = crear("input", {type: "range", min: 0, max: VELOCIDADES.length - 1, step: 1, value: 2});
	const etiquetaVelocidad = crear("label", {}, "Velocidad de la animación ");
	etiquetaVelocidad.appendChild(velocidadValor);
	s.append(etiquetaVelocidad, velocidad);

	const controles = crear("div", {class: "botones"});
	const reproducir = crear("button", {class: "btn"}, "▶ Simular");
	const siguiente = crear("button", {class: "btn sec"}, "⏭ Siguiente salto");
	const reiniciar = crear("button", {class: "btn sec"}, "⏮ Reiniciar");
	const comparar = crear("button", {class: "btn sec"}, "Comparar algoritmos");
	controles.append(reproducir, siguiente, reiniciar, comparar);
	s.appendChild(controles);

	const reloj = crear("div", {class: "reloj"});
	const relojValor = crear("span", {class: "grande"}, "0.00 ms");
	const relojDetalle = crear("span", {class: "nota"}, "");
	reloj.append(relojValor, relojDetalle);
	s.appendChild(reloj);
	const progreso = crear("div", {class: "progreso"});
	const progresoBarra = crear("div");
	progreso.appendChild(progresoBarra);
	s.appendChild(progreso);

	const ejemplo = estado.red.nodes.findIndex(n => n.name === "si1.si");
	const ejemploDestino = estado.red.nodes.findIndex(n => n.name === "se1.se");
	if (ejemplo >= 0 && ejemploDestino >= 0) {
		const sugerencia = crear("div", {class: "aviso"});
		sugerencia.appendChild(document.createTextNode("Prueba esto: de Eslovenia a Suecia con 0 ms de procesamiento la ruta más rápida da 6 saltos por Europa del Este; sube el procesamiento a 3 ms y cambia a 3 saltos por Austria y Alemania. "));
		const probar = crear("button", {class: "btn mini sec"}, "Cargar el ejemplo");
		probar.onclick = () => {
			estado.origen = ejemplo;
			estado.destino = ejemploDestino;
			ponerTipo(true);
			metrica.value = "time";
			procesamiento.value = 0;
			sincronizarSelectores();
			recalcular();
		};
		sugerencia.appendChild(probar);
		s.appendChild(sugerencia);
	}

	const resumen = seccion(tablero, null);
	const eventosSeccion = seccion(tablero, null);

	let esUnicast = false;
	function ponerTipo(valor) {
		esUnicast = valor;
		difusion.setAttribute("aria-pressed", String(!valor));
		unicast.setAttribute("aria-pressed", String(valor));
		derecha.classList.toggle("oculto", !valor);
	}
	difusion.onclick = () => { ponerTipo(false); recalcular(); };
	unicast.onclick = () => { ponerTipo(true); recalcular(); };
	ponerTipo(false);

	function opciones() {
		return {origen: estado.origen, destino: esUnicast ? estado.destino : null, metrica: metrica.value, tecnica: tecnica.value, procesamiento: +procesamiento.value};
	}
	function actualizarEtiquetas() {
		procesamientoValor.textContent = (+procesamiento.value).toFixed(1) + " ms por salto";
		velocidadValor.textContent = "×" + VELOCIDADES[+velocidad.value];
	}
	actualizarEtiquetas();

	async function recalcular() {
		detenerAnimacion();
		const pedido = opciones();
		if (esUnicast && pedido.origen === pedido.destino) {
			resumen.textContent = "";
			resumen.appendChild(crear("p", {class: "bad"}, "El origen y el destino son el mismo nodo."));
			return;
		}
		const actual = await ejecutar("propagation", entradaPropagacion(pedido, true));
		if (actual.salida.error) {
			mostrarError(resumen, actual.salida);
			eventosSeccion.textContent = "";
			estado.capa = {mostrarExtremos: true, usaDestino: esUnicast};
			pedirDibujo();
			return;
		}
		const base = hayFallas() ? (await ejecutar("propagation", entradaPropagacion(pedido, false))).salida : actual.salida;
		prepararAnimacion(actual.salida, base, actual.ms);
	}

	function prepararAnimacion(salida, base, ms) {
		const porNodo = {};
		salida.nodes.forEach(n => { porNodo[n.id] = n; });
		const enRuta = esUnicast ? new Set(salida.path) : null;
		const eventos = salida.events.filter(e => !enRuta || enRuta.has(e.node)).map(e => ({
			nodo: e.node, desde: e.from, enlace: e.edge, tiempo: e.time, saltos: e.hops,
			tiempoSalida: e.from === null ? 0 : porNodo[e.from].time
		}));
		const fin = esUnicast ? Math.max(salida.pathTime, 0) : salida.maxTime;
		const arbol = new Set(salida.events.filter(e => e.edge >= 0 && (!enRuta || enRuta.has(e.node))).map(e => e.edge));
		const inalcanzables = new Set();
		salida.unreachable.forEach(i => inalcanzables.add(i));
		let rutaFantasma = null;
		if (esUnicast && hayFallas() && base.path && base.path.join() !== salida.path.join()) {
			rutaFantasma = base.path;
		}
		estado.capa = {mostrarExtremos: true, usaDestino: esUnicast, propagacion: {porNodo, arbol, inalcanzables}, rutaFantasma};
		estado.animacion = {eventos, fin, tiempo: 0, corriendo: false, ultimoCuadro: 0, filaActual: -1, unicast: esUnicast};
		pintarResumen(salida, base, ms);
		pintarEventos();
		actualizarReloj();
		pedirDibujo();
		reproducirAnimacion();
	}

	function pintarResumen(salida, base, ms) {
		resumen.textContent = "";
		resumen.appendChild(crear("h3", {}, "Resultado"));
		const totalActivos = estado.red.nodes.length - estado.nodosCaidos.size;
		if (esUnicast) {
			if (salida.targetReachable) {
				resumen.appendChild(crear("p", {class: "grande"}, formatoMs(salida.pathTime)));
				resumen.appendChild(crear("p", {}, salida.path.map(nombreCorto).join(" → ")));
				const kilometros = salida.pathEdges.reduce((suma, e) => suma + estado.red.links[e].km, 0);
				resumen.appendChild(crear("p", {class: "nota"}, (salida.path.length - 1) + " saltos, " + formatoMiles(kilometros) + " km de fibra. Calculado con " + salida.algorithm + " en " + ms.toFixed(1) + " ms."));
			} else {
				resumen.appendChild(crear("p", {class: "grande bad"}, "No llega"));
				resumen.appendChild(crear("p", {class: "bad"}, "Con las fallas activas no queda ningún camino de " + nombreLargo(estado.origen) + " a " + nombreLargo(estado.destino) + "."));
			}
		} else {
			resumen.appendChild(crear("p", {class: "grande"}, formatoMs(salida.maxTime)));
			resumen.appendChild(crear("p", {class: "nota"}, "Tiempo para que el mensaje llegue a " + salida.reached + " de " + totalActivos + " nodos activos. Calculado con " + salida.algorithm + " en " + ms.toFixed(1) + " ms."));
			if (salida.unreachable.length) {
				resumen.appendChild(crear("p", {class: "bad"}, "Quedaron aislados por las fallas: " + salida.unreachable.map(nombreLargo).join(", ") + "."));
			}
		}
		if (hayFallas()) {
			resumen.appendChild(crear("h3", {}, "Comparado con la red sin fallas"));
			if (esUnicast) {
				const antes = base.targetReachable ? formatoMs(base.pathTime) + " por " + base.path.map(nombreCorto).join(" → ") : "no llegaba";
				const despues = salida.targetReachable ? formatoMs(salida.pathTime) + " por " + salida.path.map(nombreCorto).join(" → ") : "no llega";
				resumen.appendChild(tabla(["", "Ruta"], [["Sin fallas", antes], ["Con fallas", despues]]));
				if (base.targetReachable && salida.targetReachable) {
					const diferencia = salida.pathTime - base.pathTime;
					resumen.appendChild(crear("p", {class: diferencia > 0 ? "bad" : "ok"}, diferencia > 1e-9 ? "La falla obliga a desviarse: +" + formatoMs(diferencia) + "." : "La falla no afecta esta ruta."));
				}
			} else {
				const basePorNodo = {};
				base.nodes.forEach(n => { basePorNodo[n.id] = n; });
				const cambios = salida.nodes.filter(n => !estado.nodosCaidos.has(n.id)).map(n => {
					const b = basePorNodo[n.id];
					return {id: n.id, antes: b.reachable ? b.time : null, despues: n.reachable ? n.time : null};
				}).filter(c => c.antes !== c.despues && !(c.antes !== null && c.despues !== null && Math.abs(c.antes - c.despues) < 1e-9));
				if (!cambios.length) {
					resumen.appendChild(crear("p", {class: "ok"}, "Ningún nodo nota la falla: el mensaje llega igual de rápido a todos."));
				} else {
					cambios.sort((a, b) => (b.despues === null) - (a.despues === null) || ((b.despues || 0) - (b.antes || 0)) - ((a.despues || 0) - (a.antes || 0)));
					resumen.appendChild(tabla(["Nodo", "Sin fallas", "Con fallas", "Diferencia"], cambios.slice(0, 10).map(c => [
						nombreLargo(c.id), c.antes === null ? "—" : formatoMs(c.antes), c.despues === null ? "aislado" : formatoMs(c.despues),
						c.despues === null ? "no llega" : "+" + formatoMs(c.despues - c.antes)]), {numericas: [1, 2, 3]}));
					resumen.appendChild(crear("p", {class: "nota"}, cambios.length + " nodo(s) afectados por las fallas."));
				}
			}
		}
	}

	function pintarEventos() {
		eventosSeccion.textContent = "";
		eventosSeccion.appendChild(crear("h3", {}, "Lista de eventos"));
		eventosSeccion.appendChild(crear("p", {class: "nota"}, "Como en el modo simulación de Packet Tracer: cada fila es la llegada del mensaje a un nodo. Clic en una fila para saltar a ese momento."));
		const contenedor = crear("div", {class: "eventos"});
		const t = tabla(["Tiempo", "Llega a", "Desde", "Salto"], estado.animacion.eventos.map(e => [formatoMs(e.tiempo), nombreLargo(e.nodo), e.desde === null ? "(origen)" : nombreCorto(e.desde), String(e.saltos)]), {numericas: [0, 3]});
		[...t.querySelectorAll("tr")].slice(1).forEach((tr, k) => {
			tr.classList.add("clic");
			tr.onclick = () => {
				pausar();
				estado.animacion.tiempo = estado.animacion.eventos[k].tiempo;
				actualizarReloj();
				dibujarCapaDinamica();
			};
		});
		contenedor.appendChild(t);
		eventosSeccion.appendChild(contenedor);
	}

	function actualizarReloj() {
		const animacion = estado.animacion;
		if (!animacion) {
			return;
		}
		relojValor.textContent = formatoMs(animacion.tiempo);
		const llegados = animacion.eventos.filter(e => e.tiempo <= animacion.tiempo + 1e-9).length;
		const avance = animacion.unicast ? "nodo " + llegados + " de " + animacion.eventos.length + " de la ruta" : llegados + " de " + animacion.eventos.length + " nodos";
		relojDetalle.textContent = (animacion.tiempo / 1000).toFixed(4) + " s · " + avance;
		progresoBarra.style.width = (animacion.fin > 0 ? Math.min(100, 100 * animacion.tiempo / animacion.fin) : 100) + "%";
		reproducir.textContent = animacion.corriendo ? "⏸ Pausa" : (animacion.tiempo >= animacion.fin ? "▶ Repetir" : "▶ Continuar");
		const contenedor = eventosSeccion.querySelector(".eventos");
		const filas = [...eventosSeccion.querySelectorAll("tr")].slice(1);
		const actual = llegados - 1;
		if (actual !== animacion.filaActual) {
			filas.forEach((fila, k) => fila.classList.toggle("actual", k === actual));
			// Solo se desplaza la lista de eventos, nunca el tablero completo.
			if (filas[actual] && contenedor && animacion.corriendo) {
				contenedor.scrollTop = Math.max(0, filas[actual].offsetTop - contenedor.clientHeight / 2);
			}
			animacion.filaActual = actual;
		}
	}

	// Cada vez que la animacion arranca recibe un numero de ciclo nuevo; un cuadro que pertenece a
	// un ciclo viejo (por ejemplo, tras pausar y reanudar muy rapido) se descarta, para que nunca
	// corran dos ciclos a la vez y el reloj avance al doble.
	function cuadro(marca, animacion, ciclo) {
		const vigente = animacion === estado.animacion && animacion.corriendo && ciclo === animacion.ciclo;
		if (vigente) {
			const transcurrido = animacion.ultimoCuadro ? marca - animacion.ultimoCuadro : 0;
			animacion.ultimoCuadro = marca;
			animacion.tiempo = Math.min(animacion.fin, animacion.tiempo + transcurrido * VELOCIDADES[+velocidad.value] / MS_REALES_POR_MS_SIMULADO);
			if (animacion.tiempo >= animacion.fin) {
				animacion.corriendo = false;
			}
			actualizarReloj();
			dibujarCapaDinamica();
			if (animacion.corriendo) {
				requestAnimationFrame(siguienteMarca => cuadro(siguienteMarca, animacion, ciclo));
			}
		}
	}
	function reproducirAnimacion() {
		const animacion = estado.animacion;
		if (!animacion) {
			return;
		}
		if (animacion.tiempo >= animacion.fin) {
			animacion.tiempo = 0;
		}
		animacion.corriendo = true;
		animacion.ultimoCuadro = 0;
		animacion.ciclo = (animacion.ciclo || 0) + 1;
		const ciclo = animacion.ciclo;
		actualizarReloj();
		requestAnimationFrame(marca => cuadro(marca, animacion, ciclo));
	}
	function pausar() {
		if (estado.animacion) {
			estado.animacion.corriendo = false;
			actualizarReloj();
		}
	}
	reproducir.onclick = () => {
		if (!estado.animacion) {
			recalcular();
		} else if (estado.animacion.corriendo) {
			pausar();
		} else {
			reproducirAnimacion();
		}
	};
	siguiente.onclick = () => {
		const animacion = estado.animacion;
		if (!animacion) {
			return;
		}
		pausar();
		const proximo = animacion.eventos.find(e => e.tiempo > animacion.tiempo + 1e-9);
		animacion.tiempo = proximo ? proximo.tiempo : animacion.fin;
		actualizarReloj();
		dibujarCapaDinamica();
	};
	reiniciar.onclick = () => {
		if (estado.animacion) {
			pausar();
			estado.animacion.tiempo = 0;
			actualizarReloj();
			dibujarCapaDinamica();
		}
	};
	comparar.onclick = async () => {
		pausar();
		const filas = [];
		for (const [clave, nombre] of [["dijkstra", "Dijkstra"], ["bellmanford", "Bellman-Ford"]]) {
			const pedido = Object.assign(opciones(), {tecnica: clave});
			const {salida, ms} = await ejecutar("propagation", entradaPropagacion(pedido, true));
			filas.push({nombre, salida, ms});
		}
		const iguales = filas[0].salida.nodes && JSON.stringify(filas[0].salida.nodes) === JSON.stringify(filas[1].salida.nodes);
		const caja = crear("div");
		caja.appendChild(crear("h3", {}, "Dijkstra contra Bellman-Ford"));
		caja.appendChild(tabla(["Algoritmo", "Llega a todos en", "Tiempo (ms)"], filas.map(f => [f.nombre, f.salida.error ? "error" : formatoMs(f.salida.maxTime), f.ms.toFixed(1)]), {numericas: [1, 2]}));
		caja.appendChild(crear("p", {class: iguales ? "ok" : "bad"}, iguales ? "Los dos eligen exactamente el mismo árbol de rutas: mismas distancias, mismos saltos y mismos padres." : "Los árboles difieren."));
		caja.appendChild(crear("p", {class: "nota"}, "Dijkstra es O((V + E) log V) y Bellman-Ford O(V · E). Con 22 nodos ni se nota; en una red grande Dijkstra gana por mucho. Por eso OSPF usa Dijkstra y RIP, más viejo, usa la idea de Bellman-Ford."));
		resumen.appendChild(caja);
	};

	let espera = null;
	function recalcularConPausa() {
		actualizarEtiquetas();
		clearTimeout(espera);
		espera = setTimeout(recalcular, 160);
	}
	procesamiento.oninput = recalcularConPausa;
	velocidad.oninput = actualizarEtiquetas;
	metrica.onchange = recalcular;
	tecnica.onchange = recalcular;
	estado.recalcular = recalcular;
	ponerEstadoMapa("El punto naranja es el mensaje. Usa «Provocar falla» mientras corre la simulación para ver cómo se reencamina.");
	recalcular();
};

function detenerAnimacion() {
	if (estado.animacion) {
		estado.animacion.corriendo = false;
	}
	estado.animacion = null;
	const capa = document.getElementById("capaDinamica");
	if (capa) {
		capa.textContent = "";
	}
}

// Dibuja lo que cambia cuadro a cuadro: nodos que ya recibieron el mensaje y paquetes en camino.
function dibujarCapaDinamica() {
	const capaDinamica = document.getElementById("capaDinamica");
	capaDinamica.textContent = "";
	const animacion = estado.animacion;
	if (!animacion || !estado.capa.propagacion || !estado.vista) {
		return;
	}
	const px = pixel();
	const P = estado.proyeccion;
	const t = animacion.tiempo;
	const muchos = estado.red.nodes.length > 60;
	const radio = radioBase(muchos, px);
	const grosor = (muchos ? 1.4 : 3) * px;
	const paquete = (muchos ? 2.6 : 5) * px;
	animacion.eventos.forEach(e => {
		const destino = P[e.nodo];
		if (e.desde !== null) {
			const origen = P[e.desde];
			if (t >= e.tiempo) {
				linea(capaDinamica, origen, destino, "stroke:var(--alcanzado);stroke-width:" + grosor + ";stroke-linecap:round;pointer-events:none");
			} else if (t >= e.tiempoSalida) {
				const avance = (t - e.tiempoSalida) / Math.max(e.tiempo - e.tiempoSalida, 1e-9);
				const punto = [origen[0] + (destino[0] - origen[0]) * avance, origen[1] + (destino[1] - origen[1]) * avance];
				linea(capaDinamica, origen, punto, "stroke:var(--paquete);stroke-width:" + grosor + ";stroke-linecap:round;pointer-events:none;opacity:" + (muchos ? ".6" : "1"));
				if (!muchos) {
					capaDinamica.appendChild(crear("circle", {cx: punto[0], cy: punto[1], r: paquete * 1.8, style: "fill:var(--paquete);opacity:.25;pointer-events:none"}));
				}
				capaDinamica.appendChild(crear("circle", {cx: punto[0], cy: punto[1], r: paquete, style: "fill:var(--paquete);stroke:var(--panel);stroke-width:" + (muchos ? 0.8 : 1.5) * px + ";pointer-events:none"}));
			}
		}
		if (t >= e.tiempo - 1e-9) {
			capaDinamica.appendChild(crear("circle", {cx: destino[0], cy: destino[1], r: radio, style: "fill:" + (e.desde === null ? "var(--acc2)" : "var(--alcanzado)") + ";pointer-events:none"}));
			const etiqueta = estado.etiquetas && estado.etiquetas[e.nodo];
			if (!muchos && e.desde !== null && etiqueta) {
				capaDinamica.appendChild(crear("text", {x: etiqueta.x, y: etiqueta.y2, style: "font-size:" + 10.5 * px + "px;fill:var(--alcanzado);font-weight:600;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--mar);stroke-width:" + 3 * px + "px;pointer-events:none"}, e.tiempo.toFixed(1) + " ms"));
			}
		}
	});
}
